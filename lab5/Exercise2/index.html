<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Provinces List</title>
</head>
<body>
    <h1>Provinces in Cambodia</h1>
    <ul id="province-list"></ul>

    <script>
        const BASE_URL = "https://cambo-gazetteer.manethpak.dev/api/v1"
        const PROVINCES_URL = "/provinces"
        const provinceList = document.getElementById("province-list")

        // Use corsproxy.io
        const CORS_PROXY = "https://corsproxy.io/?"

        const CURRENT_URL = CORS_PROXY + encodeURIComponent(BASE_URL + PROVINCES_URL)

        function fetchProvinces() {
            fetch(CURRENT_URL)
            .then(response => response.json())
            .then(jsonData => {
                jsonData.data.forEach(province => {
                    const li = document.createElement("li")
                    li.textContent = `${province.name_en} (${province.name_km})`
                    provinceList.appendChild(li)
                })
            })
            .catch(err => console.error("Error fetching provinces:", err))
        }

        fetchProvinces()
    </script>
</body>
</html>
