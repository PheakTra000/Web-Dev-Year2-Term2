<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Development LAB</title>
    <link rel="icon" href="../images/T_logo.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;700&family=Manrope:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-1: #0f172a;
            --bg-2: #1e293b;
            --accent: #f59e0b;
            --card: #0b1020;
            --text: #e5e7eb;
            --muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Manrope", system-ui, sans-serif;
            color: var(--text);
            background: radial-gradient(1200px 600px at 10% 10%, #1f2937 0%, var(--bg-1) 60%) fixed,
                        linear-gradient(160deg, var(--bg-2), var(--bg-1));
            min-height: 100vh;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .page {
            max-width: 980px;
            margin: 0 auto;
            padding: 48px 20px 64px;
        }

        .hero {
            text-align: center;
            margin-bottom: 36px;
        }

        .eyebrow {
            letter-spacing: 0.3em;
            text-transform: uppercase;
            font-size: 12px;
            color: var(--muted);
        }

        .hero h1 {
            font-family: "Fraunces", serif;
            font-size: clamp(32px, 4vw, 46px);
            margin: 10px 0;
        }

        .meta {
            color: var(--muted);
            margin-bottom: 18px;
        }

        .btn {
            display: inline-block;
            padding: 10px 18px;
            border-radius: 999px;
            background: var(--accent);
            color: #1b1b1b;
            font-weight: 600;
            box-shadow: 0 10px 25px rgba(245, 158, 11, 0.25);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(245, 158, 11, 0.35);
        }

        .grid {
            display: grid;
            gap: 18px;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        }

        .card {
            background: linear-gradient(160deg, rgba(15, 23, 42, 0.9), rgba(15, 23, 42, 0.6));
            border: 1px solid rgba(148, 163, 184, 0.25);
            border-radius: 16px;
            padding: 18px;
            box-shadow: 0 20px 45px rgba(2, 6, 23, 0.35);
        }

        .card h3 {
            font-family: "Fraunces", serif;
            margin-bottom: 10px;
            font-size: 22px;
        }

        .link-list {
            display: grid;
            gap: 10px;
            margin-top: 6px;
        }

        .link-pill {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            border-radius: 12px;
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(148, 163, 184, 0.2);
            transition: border-color 0.2s ease, transform 0.2s ease;
        }

        .link-pill span {
            color: var(--muted);
            font-size: 13px;
        }

        .link-pill:hover {
            border-color: rgba(245, 158, 11, 0.7);
            transform: translateY(-2px);
        }

        .footer {
            margin-top: 32px;
            text-align: center;
            color: var(--muted);
            font-size: 13px;
        }
    </style>
</head>

<body>
    <div class="page">
        <header class="hero">
            <p class="eyebrow">Web Development Lab</p>
            <h1>Yorn PheakTra</h1>
            <p class="meta">Group G2 · Project links and submissions</p>
            <a class="btn" href="https://github.com/PheakTra000/Web-Dev-Year2-Term2">GitHub Repo</a>
        </header>

        <main class="grid">
            <section class="card">
                <h3>Lab 1</h3>
                <div class="link-list">
                    <a class="link-pill" href="./CV/index.html">CV <span>Open</span></a>
                    <a class="link-pill" href="./Schedule/index.html">Schedule <span>Open</span></a>
                </div>
            </section>

            <section class="card">
                <h3>Lab 2</h3>
                <div class="link-list">
                    <a class="link-pill" href="./Form/index.html">Form <span>Open</span></a>
                </div>
            </section>

            <section class="card">
                <h3>Lab 3</h3>
                <div class="link-list">
                    <a class="link-pill" href="./flex_grid_media_query/index.html">Responsive Page <span>Open</span></a>
                </div>
            </section>

            <section class="card">
                <h3>Assignment 1</h3>
                <div class="link-list">
                    <a class="link-pill" href="./Assignment/index.html">Landing Page <span>Open</span></a>
                </div>
            </section>

            <section class="card">
                <h3>Lab 4</h3>
                <div class="link-list">
                    <a class="link-pill" href="./lab4/index.html">Lab 4 <span>Open</span></a>
                </div>
            </section>
        </main>

        <footer class="footer">
            Built for Web Development lab submissions. 
        </footer>
    </div>
</body>
</html>
