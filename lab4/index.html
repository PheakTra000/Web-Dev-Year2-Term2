<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Document</title>

</head>
<body class="font-serif bg-gradient-to-r from-blue-100 to-purple-200 p-6">

    <div class="m-auto p-10 space-y-2">
    
    <p class="text-2xl">Enter a year to check if it is a leap year:</p>
    <input class="input" type="number" id ="yearInput" placeholder="Enter year">
    <button class="btn" onclick="checkLeapYear()">Check</button>
    <p class="text-red-500" id="result"></p>


    <p class="text-red-500" id="demo"></p>
    <button class="btn" onclick="join_element()">Join Elements</button>

    <p class="text-red-500" id="clock"></p>

    <p class="text-2xl">Greeting</p>
    <button class="btn" onclick="greet()">Show Greeting</button>

    <h3 class="text-2xl">Caesar Cipher</h3>
    <div class=" border ">
        <table id="table1">
            <tr>
                <td>Plaintext:</td>
                <td><input type="text" id="originalText" value="HELLO"></td>
            </tr>
            <tr>
                <td>Shift:</td>
                <td><input type="number" id="shiftValue" value="3"></td>
            </tr>
            <tr>
                <td></td>
                <td><input type="text" id="encryptedText" readonly></td>
            </tr>
        </table>
    </div>
<button onclick="caesarCipher()">Encrypt</button>
    


<div    ">
  <table class="table">
    <!-- head -->
    <thead>
      <tr>
        <th></th>
        <th>Name</th>
        <th>Job</th>
        <th>Favorite Color</th>
      </tr>
    </thead>
    <tbody>
      <!-- row 1 -->
      <tr>
        <th>1</th>
        <td>Cy Ganderton</td>
        <td>Quality Control Specialist</td>
        <td>Blue</td>
      </tr>
      <!-- row 2 -->
      <tr>
        <th>2</th>
        <td>Hart Hagerty</td>
        <td>Desktop Support Technician</td>
        <td>Purple</td>
      </tr>
      <!-- row 3 -->
      <tr>
        <th>3</th>
        <td>Brice Swyre</td>
        <td>Tax Accountant</td>
        <td>Red</td>
      </tr>
    </tbody>
  </table>
</div>



    <table id="table2">
        <tr>
            <td>Encrypted Text:</td>
            <td><input type="text" id="cipherText" value="KHOOR"></td>
        </tr>
        <tr>
            <td>Shift:</td>
            <td><input type="number" id="decShiftValue" value="3"></td>
        </tr>
        <tr>
            <td><button onclick="caesarDecipher()">Decrypt</button></td>
            <td><input type="text" id="decryptedText" readonly></td>
        </tr>
    </table>
 
    </div>
   
</body>


<script>
    function checkLeapYear() {
        const year = document.getElementById('yearInput').value;
        let result = '';

        if ((year % 4 === 0 && year % 100 !== 0) || (year % 400 === 0)) {
            result = year + ' is a leap year.';
        } else {
            result = year + ' is not a leap year.';
        }

        document.getElementById('result').textContent = result;
    }


    function join_element() {
        mycolor = ["Red", "Green", "White", "Black"];
        document.getElementById("demo").innerHTML = mycolor.join(",");
    }

    date = new Date();
    console.log(date.getDate());
    console.log(date.getDay());
    console.log(date.getFullYear());
    console.log(date.getHours());
    console.log(date.getMilliseconds());
    console.log(date.getMinutes());
    console.log(date.getMonth());
    console.log(date.getSeconds());


    // Function to update the clock
    function displayTime() {
        const date = new Date();
        // Use toLocaleTimeString() for a simple formatted time string
        document.getElementById("clock").innerHTML = date.toLocaleTimeString(); 
    }

    // Call the displayTime function every 1000ms (1 second)
    setInterval(displayTime, 1000);


    function caesarCipher() {
        const text = document.getElementById('originalText').value;
        const shift = parseInt(document.getElementById('shiftValue').value);
        let result = '';

        for (let i = 0; i < text.length; i++) {
            let char = text[i];
            if (char.match(/[A-Z]/)) {
                let code = ((char.charCodeAt(0) - 65 + shift) % 26) + 65;
                result += String.fromCharCode(code);
            } else if (char.match(/[a-z]/)) {
                let code = ((char.charCodeAt(0) - 97 + shift) % 26) + 97;
                result += String.fromCharCode(code);
            } else {
                result += char;
            }
        }

        document.getElementById('encryptedText').value = result;
        console.log(result);
    }
    function caesarDecipher() {
        const text = document.getElementById('cipherText').value;
        const shift = parseInt(document.getElementById('decShiftValue').value);
        let result = '';

        for (let i = 0; i < text.length; i++) {
            let char = text[i];
            if (char.match(/[A-Z]/)) {
                let code = ((char.charCodeAt(0) - 65 - shift + 26) % 26) + 65;
                result += String.fromCharCode(code);
            } else if (char.match(/[a-z]/)) {
                let code = ((char.charCodeAt(0) - 97 - shift + 26) % 26) + 97;
                result += String.fromCharCode(code);
            } else {
                result += char;
            }
        }

        document.getElementById('decryptedText').value = result;
        console.log(result);
    }


    function greet() {
        const hours = new Date().getHours();
        let greeting = '';

        if (hours < 12) {
            greeting = 'Good Morning!';
        } else if (hours < 18) {
            greeting = 'Good Afternoon!';
        } else {
            greeting = 'Good Evening!';
        }

        document.querySelector('button[onclick="greet()"]').textContent = greeting;
        console.log(greeting);  
    }
</script>

</html>
