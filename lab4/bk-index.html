<body>
    

    <h3 >Enter a year to check if it is a leap year:</h3>
    <input type="number" id="yearInput" placeholder="Enter year">
    <button onclick="checkLeapYear()">Check</button>
    <p id="result"></p>


    <p id="demo"></p>
    <button onclick="join_element()">Join Elements</button>


    <h3>Caesar Cipher</h3>
    <table id="table1">
        <tr>
            <td>Plaintext:</td>
            <td><input type="text" id="originalText" value="HELLO"></td>
        </tr>
        <tr>
            <td>Shift:</td>
            <td><input type="number" id="shiftValue" value="3"></td>
        </tr>
        <tr>
            <td><button onclick="caesarCipher()">Encrypt</button></td>
            <td><input type="text" id="encryptedText" readonly></td>
        </tr>
    </table>


    <h3>Caesar Cipher</h3>
    <table id="table2">
        <tr>
            <td>Encrypted Text:</td>
            <td><input type="text" id="cipherText" value="KHOOR"></td>
        </tr>
        <tr>
            <td>Shift:</td>
            <td><input type="number" id="decShiftValue" value="3"></td>
        </tr>
        <tr>
            <td><button onclick="caesarDecipher()">Decrypt</button></td>
            <td><input type="text" id="decryptedText" readonly></td>
        </tr>
    </table>

    <button id="showTable2Btn">Show Table 2</button>

        <tr>
            <td>Plaintext:</td>

        <tr>
            <td>Shift:</td>
            <td><input type="number" id="shiftValue" value="3"></td>
        </tr>
        <tr>
            <td><button onclick="caesarCipher()">Encrypt</button></td>
            <td><input type="text" id="encryptedText" readonly></td>

        </tr>
    </table>

</body>


<script>
    function checkLeapYear() {
        const year = document.getElementById('yearInput').value;
        let result = '';

        if ((year % 4 === 0 && year % 100 !== 0) || (year % 400 === 0)) {
            result = year + ' is a leap year.';
        } else {
            result = year + ' is not a leap year.';
        }

        document.getElementById('result').textContent = result;
    }


    function join_element() {
        mycolor = ["Red", "Green", "White", "Black"];
        document.getElementById("demo").innerHTML = mycolor.join(",");
    }

    date = new Date();
    console.log(date.getDate());
    console.log(date.getDay());
    console.log(date.getFullYear());
    console.log(date.getHours());
    console.log(date.getMilliseconds());
    console.log(date.getMinutes());
    console.log(date.getMonth());
    console.log(date.getSeconds());

    function caesarCipher() {
        const text = document.getElementById('originalText').value;
        const shift = parseInt(document.getElementById('shiftValue').value);
        let result = '';

        for (let i = 0; i < text.length; i++) {
            let char = text[i];
            if (char.match(/[A-Z]/)) {
                let code = ((char.charCodeAt(0) - 65 + shift) % 26) + 65;
                result += String.fromCharCode(code);
            } else if (char.match(/[a-z]/)) {
                let code = ((char.charCodeAt(0) - 97 + shift) % 26) + 97;
                result += String.fromCharCode(code);
            } else {
                result += char;
            }
        }

        document.getElementById('encryptedText').value = result;
        console.log(result);
    }
    function caesarDecipher() {
        const text = document.getElementById('cipherText').value;
        const shift = parseInt(document.getElementById('decShiftValue').value);
        let result = '';

        for (let i = 0; i < text.length; i++) {
            let char = text[i];
            if (char.match(/[A-Z]/)) {
                let code = ((char.charCodeAt(0) - 65 - shift + 26) % 26) + 65;
                result += String.fromCharCode(code);
            } else if (char.match(/[a-z]/)) {
                let code = ((char.charCodeAt(0) - 97 - shift + 26) % 26) + 97;
                result += String.fromCharCode(code);
            } else {
                result += char;
            }
        }

        document.getElementById('decryptedText').value = result;
        console.log(result);
    }
